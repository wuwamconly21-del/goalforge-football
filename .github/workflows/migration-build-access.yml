name: GoalForge native build access check
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/migration-build-access.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: production
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check access to the existing Worker's build controls without changes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'NODE'
          import {appendFile} from 'node:fs/promises';
          const base='https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID;
          const headers={Authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN};
          async function get(path){
            const r=await fetch(base+path,{headers,signal:AbortSignal.timeout(30000)});
            if(!r.ok)return {status:r.status};
            const data=await r.json();
            return {status:r.status,success:data.success,result:data.result};
          }
          try {
            const scripts=await get('/workers/scripts');
            const worker=Array.isArray(scripts.result)?scripts.result.find(s=>s.id==='goalforge-football1'):null;
            if(!worker?.tag)throw Error('Worker build identifier could not be read. No settings changed.');
            const triggers=await get('/builds/workers/'+worker.tag+'/triggers');
            const report={worker:'goalforge-football1',operation:'read-only',buildsHTTP:triggers.status,buildAccess:triggers.success===true};
            if(triggers.success&&Array.isArray(triggers.result)){
              report.triggers=triggers.result.map(t=>({id:t.trigger_uuid,branchIncludes:t.branch_includes,branchExcludes:t.branch_excludes}));
              const builds=await get('/builds/workers/'+worker.tag+'/builds');
              report.buildsListHTTP=builds.status;
              if(Array.isArray(builds.result))report.recentBuildStatuses=builds.result.slice(0,5).map(b=>b.status);
            }
            console.log('GOALFORGE_BUILD_ACCESS '+JSON.stringify(report));
            if(process.env.GITHUB_STEP_SUMMARY)await appendFile(process.env.GITHUB_STEP_SUMMARY,'Native build control access: '+(report.buildAccess?'available':'not available')+' (HTTP '+report.buildsHTTP+'). No settings or records changed.\n');
          } catch {
            console.error('Build-control access check failed. No settings or records changed.');
            process.exitCode=1;
          }
          NODE
