name: GoalForge full migration

on:
  workflow_dispatch:
    inputs:
      action:
        description: Preflight checks or full migration preserving existing data
        required: true
        default: preflight
        type: choice
        options: [preflight, migrate]
  push:
    branches: [main]
    paths: ['migration/request.json']

permissions:
  contents: read

jobs:
  migration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: write
    concurrency:
      group: goalforge-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:cloudflare
      - run: npm run test:migration
      - run: node tests/ci-migration.test.mjs
      - run: node --check migration/ci-migrate.mjs
      - run: npm run test:presentation
      - run: node tests/deployment.test.mjs
      - run: npm run build
      - run: npm run cloudflare:check
      - name: Check live Worker compilation
        run: npx --no-install wrangler deploy cloudflare/worker.ts --dry-run --outdir cloudflare-build/live
      - name: Install pinned source deployment tool
        run: npm install --prefix .migration-private/tools --no-save --package-lock=false netlify-cli@27.14.0
      - name: Verify credentials and perform the requested migration phase
        run: node migration/ci-migrate.mjs
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_NATIVE_BUILDS_PAUSED: ${{ vars.CLOUDFLARE_NATIVE_BUILDS_PAUSED }}
          CLOUDFLARE_LIVE_READY: ${{ vars.CLOUDFLARE_LIVE_READY }}
          GOALFORGE_MIGRATION_ACTION: ${{ github.event.inputs.action }}
