name: GoalForge public Worker health

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/worker-health.yml'
      - 'migration/probe-worker.mjs'
      - 'migration/worker-health.mjs'
      - 'tests/worker-health.test.mjs'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test readiness classification
        run: node tests/worker-health.test.mjs
      - name: Check public GoalForge endpoints
        run: node migration/probe-worker.mjs
